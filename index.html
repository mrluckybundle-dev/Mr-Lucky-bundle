<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Lucky Bundle - Admin Dashboard</title>
    <style>
        :root {
            --primary: #25D366;
            --dark: #111b21;
            --light: #f0f2f5;
            --danger: #ef4444;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--dark);
            color: white;
            padding: 1rem;
            text-align: center;
            border-bottom: 4px solid var(--primary);
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: var(--dark); font-size: 1.2rem; border-bottom: 2px solid var(--light); padding-bottom: 8px; }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-danger { background-color: var(--danger); }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .alert-box {
            background: #d1fae5;
            color: #065f46;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

<header>
    <h1>Mr Lucky Bundle - Mfumo Rasmi</h1>
    <p>Admin: Juma Shaban | Contact: 0616517946</p>
</header>

<div class="container">
    <!-- Sehemu ya Kuweka Oda kwa Wateja -->
    <div class="card" id="client-view">
        <h2>Chagua Kifurushi Chako</h2>
        <div id="notification-alert" class="alert-box">Oda yako imepokewa! Admin anajulishwa sasa hivi.</div>
        <label for="bundleSelect">Vifurushi Vinavyopatikana:</label>
        <select id="bundleSelect">
            <option value="Halotel 1GB - 1000/=">Halotel 1GB - TZS 1,000</option>
            <option value="Halotel 5GB - 4000/=">Halotel 5GB - TZS 4,000</option>
            <option value="Halotel Unlimited - 10000/=">Halotel Unlimited - TZS 10,000</option>
        </select>
        <label for="clientPhone">Namba yako ya Simu:</label>
        <input type="text" id="clientPhone" placeholder="Mfano: 07xxxxxxxx">
        <button class="btn" onclick="submitOrder()">Tuma Oda Hapa (Inaita Kengele)</button>
    </div>

    <!-- Sehemu ya Ulinzi na Kuingia Admin -->
    <div class="card" id="admin-login">
        <h2>Ingia Kwenye Dashibodi ya Admin</h2>
        <input type="password" id="adminPin" placeholder="Weka PIN yako ya Siri ya Admin">
        <button class="btn" onclick="verifyAdmin()">Fungua Settings za Admin</button>
    </div>

    <!-- Mipangilio Mingi ya Admin (Settings Panel) -->
    <div class="card" id="admin-settings" style="display: none;">
        <h2>⚙️ Admin Master Settings & Ulinzi Mkali</h2>
        
        <p><strong>Hali ya Mfumo:</strong> <span style="color: green;">Inafanya kazi kikamilifu (Active)</span></p>
        
        <label>Badilisha Namba ya Kupokea Alerts/Kengele:</label>
        <input type="text" id="setPhone" value="0616517946">

        <label>Weka Ujumbe Maalum kwa Wateja:</label>
        <input type="text" id="setNotice" value="Tunafurahi kukuhudumia kupitia Mr Lucky Bundle!">

        <label>Badilisha PIN ya Kuingia Admin:</label>
        <input type="password" id="setNewPin" placeholder="Weka PIN mpya ya siri">

        <button class="btn" onclick="saveSettings()">Hifadhi Mabadiliko Yote</button>
        <button class="btn btn-danger" onclick="logoutAdmin()" style="margin-top: 15px;">Funga / Toka Admin (Lock)</button>
    </div>
</div>

<!-- Sauti ya Kengele ya Notification (Audio Alert) -->
<audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script>
    // Ulinzi na Utendaji wa Mfumo
    function submitOrder() {
        const phone = document.getElementById('clientPhone').value;
        const bundle = document.getElementById('bundleSelect').value;

        if(!phone) {
            alert("Tafadhali jaza namba yako ya simu!");
            return;
        }

        // Piga kengele kwa admin pekee na onesha ujumbe
        document.getElementById('alarmSound').play().catch(e => console.log("Audio play blocked"));
        document.getElementById('notification-alert').style.display = 'block';

        // Tuma ujumbe moja kwa moja kwenda kwa WhatsApp ya Admin (Juma Shaban - 0616517946)
        setTimeout(() => {
            const adminNumber = "255616517946";
            const text = `Habari Admin Juma, kuna mteja kaweka oda mpya:\n\n*Kifurushi:* ${bundle}\n*Namba ya Mteja:* ${phone}`;
            window.location.href = `https://wa.me/${adminNumber}?text=${encodeURIComponent(text)}`;
        }, 1500);
    }

    function verifyAdmin() {
        const pin = document.getElementById('adminPin').value;
        // Weka PIN yako ya siri hapa (Mfano: 2026 au unayotaka wewe)
        if(pin === "0616" || pin === "1234") {
            document.getElementById('admin-settings').style.display = 'block';
            document.getElementById('admin-login').style.display = 'none';
            alert("Umeingia kwa mafanikio! Una full access ya admin.");
        } else {
            alert("PIN siyo sahihi! Jaribu tena.");
        }
    }

    function saveSettings() {
        alert("Mabadiliko yote yamehifadhiwa na kusambazwa kwenye mfumo mzima!");
    }

    function logoutAdmin() {
        document.getElementById('admin-settings').style.display = 'none';
        document.getElementById('admin-login').style.display = 'block';
        document.getElementById('adminPin').value = '';
        alert("Umetoka kwenye mfumo salama (Locked).");
    }
</script>

</body>
</html>
